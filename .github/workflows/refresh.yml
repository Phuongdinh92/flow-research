name: Refresh public research data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: public-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ../probes
          key: public-receipts-${{ runner.os }}-${{ github.run_id }}
          restore-keys: public-receipts-${{ runner.os }}-
      - name: Collect public observations
        run: node refresh_data.cjs
      - name: Verify calculations and publication
        run: node --test test-*.cjs
      - name: Commit coherent public snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-dated public research snapshots'
            git push
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi
