name: Refresh public research data
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Bounded collection profile'
        required: true
        default: market
        type: choice
        options: [market, daily, context, ledger]
  schedule:
    - cron: '23 */6 * * *'
    - cron: '41 0 * * *'
    - cron: '17 2 * * *'
    - cron: '47 3 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: public-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ../probes
          key: public-receipts-${{ runner.os }}-${{ github.run_id }}
          restore-keys: public-receipts-${{ runner.os }}-
      - name: Collect public observations
        id: collect
        continue-on-error: true
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          profile="$REQUESTED_PROFILE"
          if [ -z "$profile" ]; then
            case "$SCHEDULE" in
              '41 0 * * *') profile=daily ;;
              '17 2 * * *') profile=context ;;
              '47 3 * * *') profile=ledger ;;
              *) profile=market ;;
            esac
          fi
          node refresh_data.cjs --profile "$profile"
      - name: Verify calculations and publication
        run: node --test test-*.cjs
      - name: Commit coherent public snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-dated public research snapshots'
            git push
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi
      - name: Report collection failure after publishing retained data
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'One or more collectors failed. Verified prior data and the actual failure report were published.'
          exit 1
