name: Check Market Lab
on:
  push:
    paths:
      - 'market-lab/**'
      - '.github/workflows/market-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse live Market Lab code and verify preserved data
        run: node market-lab/check.cjs
