name: Verify public research data
on:
  push:
    paths:
      - '**.js'
      - '**.cjs'
      - '**.py'
      - '**.html'
      - '**.css'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.js'
      - '**.cjs'
      - '**.py'
      - '**.html'
      - '**.css'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations and published data
        run: node --test test-*.cjs
